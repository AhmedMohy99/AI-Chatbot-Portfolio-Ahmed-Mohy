name: Apply full Arabic i18n
on:
  push:
    branches: ['**']
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' && github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, 'Apply full Arabic i18n') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add RTL and localization assets
        run: |
          cat > rtl.css <<'EOF'
          html[dir="rtl"] body{font-family:Cairo,Inter,ui-sans-serif,system-ui,sans-serif;line-height:1.7;letter-spacing:0}
          html[dir="rtl"] .eyebrow{letter-spacing:.04em}
          html[dir="rtl"] .buttons,html[dir="rtl"] .work-grid,html[dir="rtl"] .pricing-grid,html[dir="rtl"] .process-grid{direction:rtl}
          html[dir="rtl"] .hero-card,html[dir="rtl"] .section-heading,html[dir="rtl"] .contact-card{direction:rtl}
          html[dir="rtl"] .work-info,html[dir="rtl"] .price-card,html[dir="rtl"] .process-grid>div{text-align:right}
          html[dir="rtl"] .price-card li:before{margin-right:0;margin-left:7px}
          html[dir="rtl"] .popular{right:auto;left:14px}
          html[dir="rtl"] .project-topline{direction:rtl}
          html[dir="rtl"] .browser-bar{direction:ltr}
          html[dir="rtl"] .hero-card:after{right:auto;left:-230px}
          html[dir="rtl"] .work-number{left:auto;right:14px}
          html[dir="rtl"] .live-preview,html[dir="rtl"] .project-link{direction:rtl}
          html[dir="rtl"] input,html[dir="rtl"] textarea,html[dir="rtl"] select{direction:rtl;text-align:right;font-family:Cairo,Inter,ui-sans-serif,system-ui,sans-serif}
          html[dir="rtl"] .ai-growth,html[dir="rtl"] .ai-growth *{font-family:Cairo,Inter,ui-sans-serif,system-ui,sans-serif}
          html[dir="rtl"] .ai-growth{direction:rtl;text-align:right}
          html[dir="rtl"] .ai-actions,html[dir="rtl"] .ai-playground,html[dir="rtl"] .ai-workflow{direction:rtl}
          html[dir="rtl"] .ai-chat-form{direction:rtl}
          html[dir="rtl"] .ai-chat-form input{text-align:right}
          html[dir="rtl"] .wa-body{direction:rtl}
          @media(max-width:900px){html[dir="rtl"] .hero-card,html[dir="rtl"] .section-heading,html[dir="rtl"] .contact-card{flex-direction:column;align-items:stretch}}
          EOF
          cat > i18n-enhancements.js <<'EOF'
          (()=>{
            const AR={
              'Email Me':'راسلني','WhatsApp':'واتساب','LinkedIn':'لينكدإن','GitHub':'جيت هب','Instagram':'إنستجرام','Start Your Project':'ابدأ مشروعك','LIVE HOMEPAGE':'الموقع المباشر','View Website ↗':'عرض الموقع ↗','Professional work without agency-level pricing.':'عمل احترافي بدون أسعار وكالات مرتفعة.','Business Website':'موقع أعمال','Online Store':'متجر إلكتروني','Web Application':'تطبيق ويب','Mobile App MVP':'نسخة أولية لتطبيق موبايل','Campaign Landing Page':'صفحة هبوط لحملة','Digital Marketing':'تسويق رقمي','Build My Website':'أنشئ موقعي','Build My Store':'أنشئ متجري','Build My App':'أنشئ تطبيقي','Build My Landing Page':'أنشئ صفحة الهبوط','Grow My Business':'طوّر نشاطي','MOST POPULAR':'الأكثر طلبًا','FROM':'ابتداءً من','/MONTH':'/شهريًا','HOW IT WORKS':'كيف أعمل','Discuss':'ناقش','Build':'ابنِ','Launch':'أطلق','Grow':'طوّر','READY TO BUILD?':'جاهز للبدء؟','Get a Free Quote':'احصل على عرض مجاني','Project Preview':'معاينة المشروع','OPEN WEBSITE ↗':'فتح الموقع ↗','Send':'إرسال','Calculate opportunity':'احسب الفرصة','Monthly leads':'العملاء المحتملون شهريًا','Current conversion %':'معدل التحويل الحالي %','Target conversion %':'معدل التحويل المستهدف %','Demo language':'لغة التجربة','Illustrative demo':'تجربة توضيحية','Demo online':'التجربة متصلة','More than a chatbot.':'أكثر من مجرد شات بوت.','Try the AI Agent':'جرّب وكيل الذكاء الاصطناعي','See the workflow':'شاهد مسار العمل','E-commerce Agent':'وكيل التجارة الإلكترونية','Real Estate Agent':'وكيل العقارات','Fitness Agent':'وكيل اللياقة','Hospitality Agent':'وكيل الضيافة','Consultancy Agent':'وكيل الاستشارات','Open project ↗':'فتح المشروع ↗'};
            const en=()=>localStorage.getItem('lang')||'en';
            const translateNode=n=>{if(n.nodeType===Node.TEXT_NODE){const v=n.nodeValue.trim();if(AR[v])n.nodeValue=n.nodeValue.replace(v,AR[v]);}else if(n.nodeType===Node.ELEMENT_NODE){if(n.placeholder&&AR[n.placeholder])n.placeholder=AR[n.placeholder];if(n.title&&AR[n.title])n.title=AR[n.title];if(n.getAttribute('aria-label')&&AR[n.getAttribute('aria-label')])n.setAttribute('aria-label',AR[n.getAttribute('aria-label')]);n.childNodes.forEach(translateNode)}};
            const apply=()=>{const lang=en();document.documentElement.lang=lang==='ar'?'ar':'en';document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.body.classList.toggle('rtl',lang==='ar');if(lang==='ar')document.documentElement.style.setProperty('--font-ar','Cairo');document.querySelectorAll('[data-ai-en][data-ai-ar]').forEach(el=>el.textContent=lang==='ar'?el.dataset.aiAr:el.dataset.aiEn);if(lang==='ar')translateNode(document.body);};
            window.addEventListener('storage',e=>{if(e.key==='lang')apply()});
            new MutationObserver(()=>{if(en()==='ar')apply()}).observe(document.body,{childList:true,subtree:true});
            document.addEventListener('click',e=>{if(e.target.closest('#langBtn'))setTimeout(apply,0)});
            if(document.fonts) document.fonts.ready.then(apply); else apply();
          })();
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'href="rtl.css"' not in s:s=s.replace('<link rel="stylesheet" href="growth.css" />','<link rel="stylesheet" href="growth.css" />\n  <link rel="stylesheet" href="rtl.css" />')
          if 'family=Cairo' not in s:s=s.replace('<link rel="preconnect" href="https://fonts.googleapis.com" />','<link rel="preconnect" href="https://fonts.googleapis.com" />\n  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />')
          if 'i18n-enhancements.js' not in s:s=s.replace('</body>','  <script src="i18n-enhancements.js" defer></script>\n</body>')
          if 'hreflang="ar"' not in s:
            marker='  <title>Ahmed Mohy | Websites · AI Agents · E-commerce · Automation</title>'
            tags='  <link rel="alternate" hreflang="en" href="./" />\n  <link rel="alternate" hreflang="ar" href="./#ar" />\n  <meta property="og:locale" content="en_US" />\n  <meta property="og:locale:alternate" content="ar_EG" />'
            s=s.replace(marker,marker+'\n'+tags)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html rtl.css i18n-enhancements.js
          git diff --cached --quiet || git commit -m 'Apply full Arabic i18n and RTL support'
          git push
